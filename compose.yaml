services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
      MYSQL_DATABASE: offers
      MYSQL_USER: offers
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Ejecutar python scripts/dev.py setup}
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - ./.local/mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '--silent']
      interval: 3s
      timeout: 3s
      retries: 30
